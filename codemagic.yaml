workflows:
  android-apk:
    name: RepRift Android APK
    instance_type: mac_mini_m1
    max_build_duration: 120
    triggering:
      events:
        - push
    environment:
      node: latest
      java: 17
    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
    scripts:
      - name: Install Dependencies
        script: |
          npm install
          npx expo install --fix
      - name: Build Android APK
        script: |
          npx expo prebuild --platform android --clean
          
          # --- BEGIN FIX ---
          # 1. Force the namespace to match your app.json package
          sed -i '' 's/namespace ".*"/namespace "com.omartanah.reprift"/' android/app/build.gradle
          
          # 2. Enable BuildConfig generation explicitly
          if ! grep -q 'buildFeatures' android/app/build.gradle; then
            sed -i '' '/android {/a\
                buildFeatures { buildConfig true }\
            ' android/app/build.gradle
          fi
          # --- END FIX ---
          
          cd android
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk